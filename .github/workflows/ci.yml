name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    env:
      BENDPY_REQUIRE_NATIVE: "1"
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.17"
      - name: Install pinned Bend compiler
        run: |
          curl -fL --retry 3 https://github.com/bendlang/bend/releases/download/v2.0.25/bend-2.0.25-linux-x64.tar.gz -o /tmp/bend.tar.gz
          printf '%s\n' '91c0e2640f8d2e3e73fd3dd62ed4d178ce9a6f7ce8f8980b4dc4abf7a6f9ccd4  /tmp/bend.tar.gz' | sha256sum --check
          mkdir -p "$RUNNER_TEMP/bend-toolchain"
          tar -xzf /tmp/bend.tar.gz -C "$RUNNER_TEMP/bend-toolchain"
          printf 'BENDPY_BEND=%s\n' "$RUNNER_TEMP/bend-toolchain/bend/bin/bend" >> "$GITHUB_ENV"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv run python examples/quickstart.py
      - run: uv build
