[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bend-python"
version = "0.1.0"
description = "Call native Bend functions from Python."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Caio Santos" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Compilers",
]

[project.urls]
Homepage = "https://github.com/caiodomingues/bend-python"
Issues = "https://github.com/caiodomingues/bend-python/issues"

[project.scripts]
bend-python = "bend_python.cli:main"

[dependency-groups]
dev = ["build>=1.2", "mypy>=1.15", "pytest>=8", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/bend_python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["native: compiles and executes Bend with clang"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/bend_python"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
